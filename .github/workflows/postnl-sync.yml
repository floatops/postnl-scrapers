name: PostNL Dagplanning

# Bestandsnaam (postnl-sync.yml) bewust ongewijzigd gelaten ondanks de
# hernoemde map hierboven — Supabase's trigger_postnl_sync() dispatcht naar
# deze exacte bestandsnaam via de GitHub API, en dat aanpassen betekent een
# database-functie-wijziging. De UI-naam hierboven ("PostNL Dagplanning") mag
# wel veranderen, dat raakt de dispatch-URL niet.
#
# Getriggerd door Supabase pg_cron via de GitHub API (workflow_dispatch).
# NOOIT on: schedule gebruiken — dat vuurt minuten tot uren te laat.
# Per klant en per stack (floatops/matransport#154, 2026-09-20): de dispatcher in de
# database stuurt `klant_id` en `stack` mee. `stack` kiest het GitHub-environment
# (stack-a = M&A-database, stack-b = klanten-database) en daarmee de secrets;
# `klant_id` welke klant_credentials-rijen de scraper gebruikt. Zonder inputs
# (oude dispatcher, handmatige start) precies het gedrag van vóór deze wijziging:
# stack-a met de repo-secret KLANT_ID (M&A). Die terugval verdwijnt zodra beide
# databases de nieuwe dispatcher hebben.
on:
  workflow_dispatch:
    inputs:
      klant_id:
        description: 'Klant (uuid uit klanten.id) — leeg = repo-secret KLANT_ID'
        required: false
        type: string
      stack:
        description: 'Omgeving (GitHub-environment)'
        required: false
        type: choice
        options: [stack-a, stack-b]
        default: stack-a
      datum:
        description: 'Specifieke datum (YYYY-MM-DD), leeg = vandaag'
        required: false
        type: string
      alle_datums:
        description: 'Alle datums uit het portaal synchroniseren'
        required: false
        type: boolean
        default: false

# Eén dagplanning-run tegelijk per klant per stack; andere klanten parallel.
concurrency:
  group: postnl-sync-${{ inputs.stack || 'stack-a' }}-${{ inputs.klant_id || 'standaard' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stack || 'stack-a' }}
    container: mcr.microsoft.com/playwright:v1.50.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # node_modules cachen zodat npm install niet elke run opnieuw downloadt.
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: worker/postnl-dagplanning/node_modules
          key: sync-node-${{ hashFiles('worker/postnl-dagplanning/package.json') }}

      - name: Installeer dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: worker/postnl-dagplanning
        run: npm install --omit=dev

      - name: PostNL sync
        working-directory: worker/postnl-dagplanning
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
          KLANT_ID: ${{ inputs.klant_id || secrets.KLANT_ID }}
          POSTNL_HEADLESS: 'true'
          SYNC_DATUM: ${{ inputs.datum }}
          RUN_ALL: ${{ inputs.alle_datums }}
        run: node src/index.js --once
